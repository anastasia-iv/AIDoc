data:
  dataset: "nfcorpus"
  split_train: "train"
  split_eval: "dev"
  top_k_candidates: 100
  local_path: "data/corpus_pubtator.csv"
  text_col: "text"
  context_col: "context"
  label_col: "label"

training:
  random_seed: 42
  batch_size: 16
  num_epochs: 2
  lr: 2e-5
  max_length: 256
  gradient_accumulation: 1
  eval_every_steps: 1000
  metric_for_best_model: "macro_f1"
  greater_is_better: true

paths:
  output_dir: "artifacts/medsearch-miniLM/"
  cache_dir: "~/.cache/beir"

logging:
  level: "INFO"

hardware:
  device: "cuda:0" #"cpu"

  mlflow:
  experiment_name: "med_entity_clf"
  tracking_uri: "file:./mlruns"   # можно убрать, но ок оставить
  run_name: null
